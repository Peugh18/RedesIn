<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetScope Pro - Universidad Privada del Norte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <img src="img/Logo.png" alt="NetScope Logo" />
    <span class="sidebar-title">NetScope Pro</span>
  </div>
  <nav class="sidebar-nav">
    <a class="nav-item active" data-view="dashboard" onclick="switchView('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
    </a>
    <a class="nav-item" data-view="devices" onclick="switchView('devices')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span>Dispositivos</span>
    </a>
    <a class="nav-item" data-view="wifi" onclick="switchView('wifi')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>
      <span>WiFi & Canales</span>
    </a>
    <a class="nav-item" data-view="security" onclick="switchView('security')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>Seguridad</span>
    </a>
    <a class="nav-item" data-view="topology" onclick="switchView('topology')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><line x1="12" y1="8" x2="5" y2="16"/><line x1="12" y1="8" x2="19" y2="16"/></svg>
      <span>Topologia</span>
    </a>
    <a class="nav-item" data-view="traceroute" onclick="switchView('traceroute')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 010 8.49M7.76 16.24a6 6 0 010-8.49"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 19.07a10 10 0 010-14.14"/></svg>
      <span>Traceroute</span>
    </a>
    <a class="nav-item" data-view="alerts" onclick="switchView('alerts')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span>Alertas</span>
      <span class="nav-badge" id="navAlertBadge">0</span>
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="status-dot-wrap">
      <div class="status-dot pulse" id="statusDot"></div>
      <span id="statusText" class="status-text">Iniciando...</span>
    </div>
  </div>
</aside>

<!-- MAIN -->
<div class="app-main">
  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="sidebar-toggle" onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="net-info-bar" id="netInfoBar">
        <div class="net-badge">
          <span class="net-badge-label">IP Local</span>
          <span class="net-badge-val mono" id="localIP">--</span>
        </div>
        <div class="divider-v"></div>
        <div class="net-badge">
          <span class="net-badge-label">Gateway</span>
          <span class="net-badge-val mono" id="gateway">--</span>
        </div>
        <div class="divider-v"></div>
        <div class="net-badge">
          <span class="net-badge-label">Interfaz</span>
          <span class="net-badge-val mono" id="activeInterface">--</span>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn-scan" id="btnScan" onclick="requestScan()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-6.219-8.56"/></svg>
        Escanear
      </button>
      <div class="live-clock" id="liveClock"></div>
    </div>
  </header>

  <!-- VIEW CONTAINERS (loaded dynamically) -->
  <section class="view active" id="view-dashboard"></section>
  <section class="view" id="view-devices"></section>
  <section class="view" id="view-wifi"></section>
  <section class="view" id="view-security"></section>
  <section class="view" id="view-topology"></section>
  <section class="view" id="view-traceroute"></section>
  <section class="view" id="view-alerts"></section>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Detalles del Dispositivo</div>
      <button class="modal-close" onclick="closeModal()">&#10005;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Scripts modulares -->
<script src="/socket.io/socket.io.js"></script>
<script src="js/state.js"></script>
<script src="js/labels.js"></script>
<script src="js/socket.js"></script>
<script src="js/views.js"></script>
<script src="js/devices.js"></script>
<script src="js/wifi.js"></script>
<script src="js/security.js"></script>
<script src="js/alerts.js"></script>
<script src="js/traffic.js"></script>
<script src="js/topology.js"></script>
<script src="js/traceroute.js"></script>
<script src="js/modals.js"></script>
<script src="js/app.js"></script>
</body>
</html>
