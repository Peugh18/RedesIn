<div class="view-header" style="display: flex; justify-content: space-between; align-items: center;">
  <div>
    <h2 class="view-title">Dashboard de Triaje L1</h2>
    <p class="view-subtitle">Resumen de incidentes de red que requieren atención</p>
  </div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
  <div style="background: var(--bg-card); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); text-align: center;">
    <h3 style="color: var(--text-sec); font-size: 13px; text-transform: uppercase;">Total Dispositivos</h3>
    <div id="triajeTotal" style="font-size: 32px; font-weight: bold; margin-top: 10px; color: var(--text-main);">0</div>
  </div>
  <div style="background: rgba(255, 68, 68, 0.1); padding: 20px; border-radius: 8px; border: 1px solid rgba(255, 68, 68, 0.3); text-align: center;">
    <h3 style="color: var(--red); font-size: 13px; text-transform: uppercase;">Atención Requerida</h3>
    <div id="triajeProblemas" style="font-size: 32px; font-weight: bold; margin-top: 10px; color: var(--red);">0</div>
  </div>
  <div style="background: rgba(0, 200, 83, 0.1); padding: 20px; border-radius: 8px; border: 1px solid rgba(0, 200, 83, 0.3); text-align: center;">
    <h3 style="color: var(--green); font-size: 13px; text-transform: uppercase;">Equipos Sanos</h3>
    <div id="triajeSanos" style="font-size: 32px; font-weight: bold; margin-top: 10px; color: var(--green);">0</div>
  </div>
</div>

<div class="table-container">
  <div style="padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px;">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" style="width: 20px; height: 20px;"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <h3 style="font-size: 15px; font-weight: 500; color: var(--text-main);">Equipos Críticos (Prioridad Alta)</h3>
  </div>
  <table class="data-table">
    <thead>
      <tr>
        <th>IP / Hostname</th>
        <th>Problema Detectado</th>
        <th>Latencia</th>
        <th>Loss</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="triajeCriticosTable">
      <tr><td colspan="5" class="empty-state">Analizando red...</td></tr>
    </tbody>
  </table>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-top: 1px solid var(--border-color); background: var(--bg-dark);">
    <div style="font-size: 13px; color: var(--text-sec);" id="triajePaginationInfo">Mostrando 0-0 de 0</div>
    <div style="display: flex; gap: 8px;">
      <button class="btn" style="background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 5px 10px; cursor: pointer;" id="triajeBtnPrev" onclick="triajeChangePage(-1)">Anterior</button>
      <button class="btn" style="background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 5px 10px; cursor: pointer;" id="triajeBtnNext" onclick="triajeChangePage(1)">Siguiente</button>
    </div>
  </div>
</div>
