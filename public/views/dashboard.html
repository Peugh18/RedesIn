<div class="view-header">
  <h1 class="view-title">Dashboard</h1>
  <p class="view-subtitle">Visión general de la red - Universidad Privada del Norte</p>
</div>

<div class="metrics-bar">
  <div class="metric-card">
    <div class="metric-icon green">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    </div>
    <div>
      <div class="metric-val" id="totalDevices">0</div>
      <div class="metric-label">Dispositivos</div>
    </div>
  </div>
  <div class="metric-card">
    <div class="metric-icon cyan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
    </div>
    <div>
      <div class="metric-val" id="onlineDevices">0</div>
      <div class="metric-label">En Linea</div>
    </div>
  </div>
  <div class="metric-card">
    <div class="metric-icon red">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    </div>
    <div>
      <div class="metric-val" id="offlineDevices">0</div>
      <div class="metric-label">Desconectados</div>
    </div>
  </div>
  <div class="metric-card">
    <div class="metric-icon purple">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>
    </div>
    <div>
      <div class="metric-val" id="wifiCount">0</div>
      <div class="metric-label">Redes WiFi</div>
    </div>
  </div>
  <div class="metric-card">
    <div class="metric-icon orange">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </div>
    <div>
      <div class="metric-val" id="alertCount">0</div>
      <div class="metric-label">Alertas</div>
    </div>
  </div>
  <div class="metric-card">
    <div class="metric-icon blue">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    </div>
    <div>
      <div class="metric-val" id="avgPing">—<span style="font-size:0.5em;opacity:0.6">ms</span></div>
      <div class="metric-label">Ping Promedio</div>
    </div>
  </div>
</div>

<div class="panel traffic-section">
  <div class="panel-header">
    <div class="panel-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 9l-6 6-2-2-4 4"/></svg>
      Monitor de Tráfico de Red (Real)
    </div>
  </div>
  <div class="traffic-card" style="background:transparent; border:none; padding:0;">
    <div class="traffic-stats-mini">
      <div class="mini-stat">
        <span class="label">Descarga</span>
        <span class="value" id="dl-speed">0.0 Mbps</span>
      </div>
      <div class="mini-stat">
        <span class="label">Subida</span>
        <span class="value" id="ul-speed">0.0 Mbps</span>
      </div>
    </div>
    <div class="chart-container">
      <canvas id="trafficChart"></canvas>
    </div>
  </div>
</div>

<div class="scan-progress-wrap" id="scanProgressWrap" style="display:none;">
  <div class="scan-progress-header">
    <div class="spin-icon"></div>
    <span id="scanProgressText">Escaneando red...</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>
