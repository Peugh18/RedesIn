<div class="view-header">
  <h1 class="view-title">WiFi & Canales</h1>
  <p class="view-subtitle">Análisis de cobertura WiFi - Campus Universitario UPN</p>
</div>

<div class="wifi-grid">
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>
        Redes WiFi Cercanas
      </div>
      <div class="wifi-tabs">
        <div class="wtab" id="tab24" onclick="setWifiTab('2.4')">2.4 GHz</div>
        <div class="wtab" id="tab5" onclick="setWifiTab('5')">5 GHz</div>
        <div class="wtab active" id="tabAll" onclick="setWifiTab('all')">Todas</div>
        <button class="btn-scan-wifi" onclick="requestWifiScan()" style="margin-left:10px;padding:4px 10px;font-size:11px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px;vertical-align:middle;margin-right:3px"><path d="M21 12a9 9 0 11-6.219-8.56"/></svg>
          Escanar Ahora
        </button>
      </div>
    </div>
    <div class="wifi-list" id="wifiList">
      <div class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:28px;height:28px;opacity:0.5"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><circle cx="12" cy="20" r="1"/></svg>
        </div>
        <p>Escaneando redes WiFi...</p>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        Mapa de Canales
      </div>
      <div class="channel-legend">
        <span class="legend-dot low"></span> Libre
        <span class="legend-dot med"></span> Medio
        <span class="legend-dot high"></span> Saturado
      </div>
    </div>
    <div class="channel-map" id="channelMap">
      <div class="channel-subtitle">2.4 GHz — Canales 1-14</div>
      <div class="channel-grid" id="channelGrid24"></div>
      <div class="channel-subtitle" style="margin-top:16px">5 GHz — Canales UNII</div>
      <div class="channel-grid" id="channelGrid5"></div>
      <div class="channel-heat-legend">
        <span class="heat-item"><span class="heat-dot" style="background:#00e676"></span> Libre</span>
        <span class="heat-item"><span class="heat-dot" style="background:#fdba30"></span> Medio</span>
        <span class="heat-item"><span class="heat-dot" style="background:#ff9800"></span> Congestionado</span>
        <span class="heat-item"><span class="heat-dot" style="background:#ff4757"></span> Saturado</span>
      </div>
    </div>
    <div class="channel-recommendation" id="channelRecommendation" style="display:none;">
      <div class="rec-title">Canal Optimo Recomendado</div>
      <div class="rec-grid">
        <div class="rec-item">
          <span class="rec-band">2.4 GHz</span>
          <span class="rec-channel" id="recChannel24">—</span>
          <span class="rec-detail" id="recDetail24"></span>
        </div>
        <div class="rec-item">
          <span class="rec-band">5 GHz</span>
          <span class="rec-channel" id="recChannel5">—</span>
          <span class="rec-detail" id="recDetail5"></span>
        </div>
      </div>
    </div>
  </div>
</div>
