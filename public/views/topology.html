<div class="view-header">
  <h1 class="view-title">Topologia de Red</h1>
  <p class="view-subtitle">Visualización de infraestructura - Universidad Privada del Norte</p>
</div>

<div class="topology-controls">
  <button class="btn-scan" onclick="loadTopology()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M21 12a9 9 0 11-6.219-8.56"/></svg>
    Actualizar Topologia
  </button>
  <div class="topology-legend">
    <span class="topo-legend-item"><span class="topo-dot gateway"></span> Gateway</span>
    <span class="topo-legend-item"><span class="topo-dot local"></span> Este equipo</span>
    <span class="topo-legend-item"><span class="topo-dot online"></span> En línea</span>
    <span class="topo-legend-item"><span class="topo-dot offline"></span> Desconectado</span>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <div class="panel-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:16px;height:16px"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><line x1="12" y1="8" x2="5" y2="16"/><line x1="12" y1="8" x2="19" y2="16"/></svg>
      Mapa de Red (Estrella)
    </div>
  </div>
  <div class="topology-canvas" id="topologyCanvas">
    <div class="empty-state" style="padding:40px 0">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:32px;height:32px;opacity:0.4"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><line x1="12" y1="8" x2="5" y2="16"/><line x1="12" y1="8" x2="19" y2="16"/></svg>
      </div>
      <p>Cargando topologia...</p>
    </div>
  </div>
</div>

<!-- ARP Analysis Panel -->
<div class="panel" style="margin-top:20px">
  <div class="panel-header">
    <div class="panel-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:16px;height:16px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Tabla ARP & Deteccion de Spoofing
    </div>
  </div>
  <div id="arpAnalysis">
    <div class="empty-state" style="padding:20px 0">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:28px;height:28px;opacity:0.4"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      </div>
      <p>Analizando tabla ARP...</p>
    </div>
  </div>
</div>
