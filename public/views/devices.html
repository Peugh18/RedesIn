<div class="view-header">
  <h1 class="view-title">Dispositivos en Red</h1>
  <p class="view-subtitle">Deteccion y monitoreo de todos los dispositivos conectados</p>
</div>

<div class="panel">
  <div class="panel-header">
    <div class="panel-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      Lista de Dispositivos
    </div>
    <div class="panel-actions">
      <input type="text" class="search-input" id="deviceSearch" placeholder="Filtrar por IP, hostname..." oninput="filterDevices()" />
      <div class="badge-filter" id="filterAll" onclick="setFilter('all')" data-active="true">Todos</div>
      <div class="badge-filter" id="filterOnline" onclick="setFilter('online')">En línea</div>
      <div class="badge-filter" id="filterOffline" onclick="setFilter('offline')">Desconectados</div>
    </div>
  </div>
  <div class="table-wrap">
    <table class="device-table" id="deviceTable">
      <thead>
        <tr>
          <th>Estado</th>
          <th>IP Address</th>
          <th>Hostname</th>
          <th>MAC</th>
          <th>Fabricante</th>
          <th>Tipo</th>
          <th>Ping</th>
          <th>Jitter</th>
          <th>Pkt Loss</th>
          <th>Calidad</th>
          <th>Historial</th>
        </tr>
      </thead>
      <tbody id="deviceTableBody">
        <tr class="empty-row">
          <td colspan="11">
            <div class="empty-state">
              <div class="empty-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:28px;height:28px;opacity:0.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </div>
              <p>Iniciando escaneo de red...</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
