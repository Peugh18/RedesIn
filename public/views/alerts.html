<div class="view-header">
  <h1 class="view-title">Centro de Alertas</h1>
  <p class="view-subtitle">Historial de eventos y notificaciones del sistema</p>
</div>

<div class="panel">
  <div class="panel-header">
    <div class="panel-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Alertas Recientes
      <span class="alert-count-badge" id="alertBadge">0</span>
    </div>
    <button class="btn-clear" onclick="clearAlerts()">Limpiar</button>
  </div>
  <div class="alerts-list" id="alertsList">
    <div class="empty-state" style="padding:20px 0">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:28px;height:28px;opacity:0.5;color:var(--green)"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <p>Sin alertas activas</p>
    </div>
  </div>
</div>
